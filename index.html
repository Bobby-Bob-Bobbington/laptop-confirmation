<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Your Laptop Purchase</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #161a2d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.14), transparent 25rem),
          radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.11), transparent 23rem),
          #f6f7fb;
      }

      main {
        width: min(90vw, 580px);
      }

      .card {
        position: relative;
        z-index: 2;
        padding: clamp(2rem, 7vw, 3.5rem);
        border: 1px solid rgba(22, 26, 45, 0.08);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 24px 70px rgba(31, 35, 66, 0.12),
          0 2px 8px rgba(31, 35, 66, 0.04);
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #6366f1;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.2rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .details {
        margin: 1.25rem auto 2rem;
        color: #626779;
        font-size: clamp(1rem, 3vw, 1.15rem);
        line-height: 1.7;
      }

      .details strong {
        display: block;
        color: #161a2d;
        font-size: 1.08em;
      }

      button {
        min-width: 180px;
        min-height: 52px;
        border: 0;
        border-radius: 999px;
        background: #161a2d;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(22, 26, 45, 0.18);
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      button:hover {
        transform: translateY(-2px);
        background: #303551;
        box-shadow: 0 16px 28px rgba(22, 26, 45, 0.22);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 4px solid rgba(99, 102, 241, 0.28);
        outline-offset: 4px;
      }

      #success {
        display: none;
      }

      #success.visible {
        display: block;
        animation: arrive 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      #purchase.hidden {
        display: none;
      }

      .check {
        width: 82px;
        height: 82px;
        margin: 0 auto 1.5rem;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #ecfdf5;
        color: #059669;
        font-size: 2.5rem;
        font-weight: 900;
      }

      #confetti {
        position: fixed;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button,
        #success.visible {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <main>
      <section class="card" id="purchase" aria-labelledby="purchase-title">
        <p class="eyebrow">One final step</p>
        <h1 id="purchase-title">Confirming your purchase of: $0.01</h1>
        <p class="details">
          <strong>Inspiron 14</strong>
          AMD Ryzen 5 with integrated graphics
        </p>
        <button id="confirm-button" type="button">Confirm</button>
      </section>

      <section class="card" id="success" role="status" aria-live="polite">
        <div class="check" aria-hidden="true">&#10003;</div>
        <p class="eyebrow">All done</p>
        <h1>Your purchase has been confirmed</h1>
      </section>
    </main>

    <script>
      const purchase = document.querySelector("#purchase");
      const success = document.querySelector("#success");
      const confirmButton = document.querySelector("#confirm-button");
      const canvas = document.querySelector("#confetti");
      const context = canvas.getContext("2d");
      const colors = ["#6366f1", "#ec4899", "#f59e0b", "#10b981", "#38bdf8"];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let particles = [];
      let animationFrame = null;

      function resizeCanvas() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * pixelRatio;
        canvas.height = window.innerHeight * pixelRatio;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function createConfetti() {
        particles = Array.from({ length: reduceMotion ? 0 : 180 }, () => ({
          x: window.innerWidth / 2,
          y: window.innerHeight * 0.42,
          width: 6 + Math.random() * 7,
          height: 3 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          velocityX: (Math.random() - 0.5) * 17,
          velocityY: -7 - Math.random() * 11,
          gravity: 0.18 + Math.random() * 0.12,
          drag: 0.985,
          rotation: Math.random() * Math.PI,
          rotationSpeed: (Math.random() - 0.5) * 0.25,
        }));
      }

      function animateConfetti() {
        context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        particles = particles.filter(
          (particle) =>
            particle.y < window.innerHeight + 30 &&
            particle.x > -30 &&
            particle.x < window.innerWidth + 30,
        );

        for (const particle of particles) {
          particle.velocityX *= particle.drag;
          particle.velocityY += particle.gravity;
          particle.x += particle.velocityX;
          particle.y += particle.velocityY;
          particle.rotation += particle.rotationSpeed;

          context.save();
          context.translate(particle.x, particle.y);
          context.rotate(particle.rotation);
          context.fillStyle = particle.color;
          context.fillRect(
            -particle.width / 2,
            -particle.height / 2,
            particle.width,
            particle.height,
          );
          context.restore();
        }

        if (particles.length > 0) {
          animationFrame = requestAnimationFrame(animateConfetti);
        } else {
          context.clearRect(0, 0, window.innerWidth, window.innerHeight);
          cancelAnimationFrame(animationFrame);
        }
      }

      confirmButton.addEventListener("click", () => {
        purchase.classList.add("hidden");
        success.classList.add("visible");
        resizeCanvas();
        createConfetti();
        animateConfetti();
      });

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
    </script>
  </body>
</html>
